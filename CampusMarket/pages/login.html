<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="../css/acc.css">
    <link rel="icon" href="../images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header class="navbar">
        <div class="brand">
            <img src="../images/logo.png" alt="Campus Market Logo" class="logo">
            <h1>CampusMarket</h1>
        </div>
    </header>

    <main class="content">
        <div class="hero-box">
            <h1> Welcome Back! </h1>
            <h3> Log in to you CampusMarket account </h3>

            <!-- Email -->
            <div class="input-box">
                <input type="email" name="email" required>
                <label>Email Address</label>
            </div>

            <!-- Password -->
            <div class="input-box">
                <input type="password" name="password" id="passwordInput" required>
                <label>Password</label>
                <i class="bx bx-hide toggle-password" id="togglePassword"></i>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox">Remember me</label>
                <a href="#">Forgot Password</a>
            </div>

            <button type="submit" class="btn">Log in</button>
            <div class="register">
                <p>Don't have an account?<a href="createacc.html">  Register</a></p>
            </div>
        </div>
    </main>

    <script>
        const passwordInput = document.querySelector('#passwordInput');
        const togglePassword = document.querySelector('#togglePassword');

        togglePassword.addEventListener('click', function () {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';

            this.classList.toggle('bx-show', isPassword);
            this.classList.toggle('bx-hide', !isPassword);
        });
    </script>
</body>
</html>
